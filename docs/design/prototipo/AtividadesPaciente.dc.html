<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acolhe — Atividades da paciente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#4040D6}a:hover{color:#1C1A5E}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.reveal{animation:open .36s cubic-bezier(.2,.7,.2,1) both}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.seg{position:relative;z-index:1;flex:1 1 0;height:40px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#5C6385;cursor:pointer;border-radius:10px;transition:color .3s ease}
.seg.on{color:#161A3A}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#FFFFFF;border-radius:10px;box-shadow:0 1px 2px rgba(22,26,58,.1),0 4px 12px rgba(22,26,58,.06);transition:transform .42s cubic-bezier(.2,.7,.2,1)}
.seg-pill.right{transform:translateX(100%)}
.task{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:#FFFFFF;border:1px solid #DDE3F3;text-decoration:none;color:inherit;transition:border-color .2s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
.task:hover{border-color:#A7AFCF;transform:translateX(2px)}
.sent{border-radius:14px;background:#FFFFFF;border:1px solid #DDE3F3;overflow:hidden}
.toggle{width:100%;min-height:44px;padding:0;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#4040D6;cursor:pointer;display:flex;align-items:center;gap:6px}
.toggle svg{transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.toggle.open svg{transform:rotate(180deg)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:11px;font-weight:500;color:#5C6385;text-decoration:none}
.tabbar a.on{color:#1C1A5E}
:focus-visible{outline:2px solid #4040D6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F7FE; color: #161A3A; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif; overflow: hidden">

  <div class="scroll" style="flex: 1; overflow-y: auto; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">

    <header class="rise" style="display: flex; flex-direction: column; gap: 6px">
      <p class="mono" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5C6385">Enviadas pela Mariana</p>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em">Atividades</h1>
    </header>

    <div class="rise" role="tablist" aria-label="Filtrar atividades" style="animation-delay: .06s; position: relative; display: flex; padding: 4px; background: #E7EBF8; border-radius: 14px">
      <div class="{{pillClass}}" aria-hidden="true"></div>
      <button type="button" role="tab" class="{{segPend}}" aria-selected="{{isPend}}" onClick="{{showPend}}">Pendentes · 3</button>
      <button type="button" role="tab" class="{{segSent}}" aria-selected="{{isSent}}" onClick="{{showSent}}">Enviadas · 3</button>
    </div>

    <sc-if value="{{isPend}}" hint-placeholder-val="{{ true }}">
      <ul class="fade" role="tabpanel" aria-label="Atividades pendentes" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{pending}}" as="a" hint-placeholder-count="3">
          <li class="fade" style="{{a.delay}}">
            <a href="Responder.dc.html" class="task">
              <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #E6EAFD; color: #4040D6; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></span>
              <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
                <span style="font-size: 15px; font-weight: 600">{{a.title}}</span>
                <span style="font-size: 13px; {{a.dueStyle}}">{{a.due}}</span>
                <span style="font-size: 12px; color: #5C6385">{{a.meta}}</span>
                <sc-if value="{{a.hasDraft}}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; margin-top: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: #EFF2FB; color: #3E4466; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center">{{a.draft}}</span>
                </sc-if>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C6385" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
      <ul class="fade" role="tabpanel" aria-label="Atividades enviadas" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{sent}}" as="a" hint-placeholder-count="3">
          <li class="sent fade" style="{{a.delay}}">
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
                <span style="font-size: 15px; font-weight: 600">{{a.title}}</span>
                <span style="flex: none; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; {{a.chipStyle}}">{{a.status}}</span>
              </div>
              <span style="font-size: 13px; color: #5C6385">{{a.meta}}</span>
              <sc-if value="{{a.hasComment}}" hint-placeholder-val="{{ false }}">
                <button type="button" class="{{a.toggleCls}}" aria-expanded="{{a.open}}" onClick="{{a.toggle}}">
                  {{a.toggleLabel}}
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </button>
                <sc-if value="{{a.open}}" hint-placeholder-val="{{ false }}">
                  <div class="reveal" style="padding: 12px 14px; border-radius: 12px; background: #E6EAFD; display: flex; flex-direction: column; gap: 6px">
                    <span class="mono" style="font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #2B2E9E">Comentário da Mariana · {{a.commentDate}}</span>
                    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #161A3A">{{a.comment}}</p>
                  </div>
                </sc-if>
              </sc-if>
            </div>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </div>

  <nav class="tabbar" aria-label="Navegação" style="display: flex; padding: 4px 8px 12px; background: #FFFFFF; border-top: 1px solid #DDE3F3">
    <a href="Paciente.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>Início</a>
    <a href="AtividadesPaciente.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10M4.5 5l.5.5L6.5 4M4.5 12l.5.5 1.5-1.5M4.5 19l.5.5 1.5-1.5"></path></svg>Atividades</a>
    <a href="CheckinPaciente.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>Check-in</a>
    <a href="ProntuarioPaciente.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>Histórico</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pend', open: 'gratidao' };
  }
  renderVals() {
    const s = this.state;
    const isPend = s.tab === 'pend';
    const delay = (i) => 'animation-delay: ' + (i * 0.06) + 's';
    const pending = [
      { title: 'Higiene do sono', due: 'Atrasada desde ontem', late: true, meta: 'Checklist · 7 itens', draft: '' },
      { title: 'Registro de pensamentos', due: 'Até amanhã, 14h', late: false, meta: '4 perguntas', draft: 'Rascunho salvo · 2 de 4' },
      { title: 'Diário do sono', due: 'Até domingo', late: false, meta: '3 perguntas', draft: '' }
    ];
    const sent = [
      { id: 'gratidao', title: 'Diário de gratidão', meta: 'Enviada em 6 out', status: 'Revisada', comment: 'Gostei de ver que você anotou coisas pequenas do dia a dia. Vamos falar sobre o item da caminhada na sessão.', commentDate: '7 out' },
      { id: 'pensamentos', title: 'Registro de pensamentos', meta: 'Enviada em 2 out', status: 'Revisada', comment: 'Você identificou a catastrofização mais rápido desta vez. Continue anotando a intensidade antes e depois.', commentDate: '3 out' },
      { id: 'sono', title: 'Higiene do sono', meta: 'Enviada em 26 set', status: 'Aguardando revisão', comment: '', commentDate: '' }
    ];
    return {
      isPend: isPend,
      isSent: !isPend,
      pillClass: isPend ? 'seg-pill' : 'seg-pill right',
      segPend: isPend ? 'seg on' : 'seg',
      segSent: isPend ? 'seg' : 'seg on',
      showPend: () => this.setState({ tab: 'pend' }),
      showSent: () => this.setState({ tab: 'sent' }),
      pending: pending.map((a, i) => Object.assign({}, a, {
        delay: delay(i),
        hasDraft: !!a.draft,
        dueStyle: a.late ? 'color: #9E3522; font-weight: 500' : 'color: #3E4466'
      })),
      sent: sent.map((a, i) => {
        const open = s.open === a.id;
        return Object.assign({}, a, {
          delay: delay(i),
          hasComment: !!a.comment,
          open: open,
          toggleCls: open ? 'toggle open' : 'toggle',
          toggleLabel: open ? 'Ocultar comentário' : 'Ver comentário da Mariana',
          chipStyle: a.status === 'Revisada' ? 'background: #E6EAFD; color: #2B2E9E' : 'background: #EFF2FB; color: #3E4466',
          toggle: () => this.setState({ open: open ? '' : a.id })
        });
      })
    };
  }
}
</script>
</body>
</html>
