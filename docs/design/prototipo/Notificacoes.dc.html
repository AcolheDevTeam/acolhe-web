<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acolhe — Notificações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F7FE}
*{box-sizing:border-box}
a{color:#4040D6}a:hover{color:#1C1A5E}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fade .36s cubic-bezier(.2,.7,.2,1) both}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:translateX(24px)}}
.leaving{animation:leave .35s cubic-bezier(.2,.7,.2,1) both}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#3E4466;text-decoration:none;font-size:14px;font-weight:500;transition:background .2s ease,color .2s ease}
.nav:hover{background:#ECEFFB;color:#161A3A}
.btn{height:40px;padding:0 16px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .25s ease,box-shadow .25s ease,transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s ease,color .25s ease;white-space:nowrap}
.btn:active{transform:scale(.985)}
.btn-s{border:1px solid #CBD2EA;background:#FFFFFF;color:#161A3A}.btn-s:hover{border-color:#A7AFCF;background:#F7F8FE}
.btn-q{border:0;background:transparent;color:#4040D6}.btn-q:hover{background:#E6EAFD}
.btn-q:disabled{color:#A7AFCF;cursor:default;background:transparent}
.bell{position:relative;width:40px;height:40px;border:1px solid #DDE3F3;border-radius:10px;background:#FFFFFF;color:#1C1A5E;display:inline-flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#D9503C;color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.seg{position:relative;z-index:1;width:120px;height:36px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#5C6385;cursor:pointer;border-radius:9px;transition:color .3s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg.on{color:#161A3A}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:120px;background:#FFFFFF;border-radius:9px;box-shadow:0 1px 2px rgba(22,26,58,.1);transition:transform .42s cubic-bezier(.2,.7,.2,1)}
.note{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;transition:background .3s ease,opacity .3s ease}
.note:hover{background:#F7F8FE}
.note.unread{background:#F1F3FE}
.note.read{opacity:.62}
.note a.go{color:#161A3A;text-decoration:none}
.note a.go:hover{text-decoration:underline;text-underline-offset:3px}
.mark{width:36px;height:36px;flex:none;border:0;border-radius:8px;background:transparent;color:#5C6385;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s ease,color .2s ease}
.mark:hover{background:#E6EAFD;color:#1C1A5E}
.card{background:#FFFFFF;border:1px solid #DDE3F3;border-radius:16px}
:focus-visible{outline:2px solid #4040D6;outline-offset:2px}
@media (max-width:760px){.side{max-width:none!important}.side nav{flex-direction:row!important;flex-wrap:wrap}.side .sec{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #F5F7FE; color: #161A3A; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">

  <aside class="side" style="flex: 1 1 248px; max-width: 264px; padding: 24px 16px; border-right: 1px solid #DDE3F3; display: flex; flex-direction: column; gap: 24px; background: #F5F7FE">
    <a href="Dashboard.dc.html" aria-label="Acolhe, ir para o início" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #161A3A; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4040D6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 17a10 10 0 0 0-20 0"></path><path d="M18 17a6 6 0 0 0-12 0" stroke="#FF7A5C"></path><path d="M14 17a2 2 0 0 0-4 0" stroke="currentColor"></path></svg>
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">Acolhe</span>
    </a>
    <button type="button" class="sec" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid #DDE3F3; border-radius: 12px; background: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #1C1A5E; color: #FF8A70; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">CT</span>
      <span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 600">Clínica Travessia</span><span style="font-size: 12px; color: #5C6385">Trocar clínica</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C6385" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
    </button>
    <nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Dashboard.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>Início</a>
      <a href="Pacientes.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14a6.5 6.5 0 0 1 3 6"></path></svg>Pacientes<span class="mono" style="margin-left: auto; font-size: 12px; color: #5C6385">14</span></a>
      <a href="Agenda.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Agenda</a>
      <a href="Atividades.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10M4.5 5l.5.5L6.5 4M4.5 12l.5.5 1.5-1.5M4.5 19l.5.5 1.5-1.5"></path></svg>Atividades<span class="mono" style="margin-left: auto; font-size: 12px; color: #4040D6">2</span></a>
      <a href="Documentos.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Documentos</a>
      <a href="Templates.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 4v5h6"></path></svg>Templates</a>
      <p class="mono sec" style="margin: 18px 12px 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5C6385">Só você</p>
      <a href="Registro.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg>Registro Documental</a>
      <p class="mono sec" style="margin: 18px 12px 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5C6385">Clínica</p>
      <a href="PainelClinica.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Painel</a>
      <a href="Equipe.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13M10 21v-5h4v5"></path></svg>Equipe</a>
      <a href="Assinatura.dc.html" class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>Assinatura</a>
    </nav>
    <div class="sec" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #DDE3F3">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E6EAFD; color: #2B2E9E; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">MS</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1"><span style="font-size: 14px; font-weight: 600">Mariana Sá</span><span class="mono" style="font-size: 11px; color: #5C6385">CRP 06/123456</span></span>
      <a href="Perfil.dc.html" aria-label="Ajustes" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #5C6385"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg></a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px clamp(16px, 4vw, 48px) 56px; display: flex; flex-direction: column; gap: 24px">
    <div class="rise" style="display: flex; justify-content: flex-end; gap: 10px">
      <span class="bell" role="img" aria-label="{{bellLabel}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="badge mono" aria-hidden="true">{{unread}}</span></sc-if>
      </span>
    </div>

    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 24px">
      <header class="rise" style="animation-delay: .04s; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Notificações</h1>
          <p style="margin: 0; font-size: 15px; color: #3E4466">{{summary}}</p>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" class="btn btn-q" disabled="{{noUnread}}" onClick="{{markAll}}">Marcar todas como lidas</button>
          <a href="PrefNotificacoes.dc.html" class="btn btn-s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Preferências</a>
        </div>
      </header>

      <div class="rise" role="group" aria-label="Filtro" style="animation-delay: .08s; position: relative; display: flex; align-self: flex-start; padding: 4px; background: #E7EBF8; border-radius: 12px">
        <div class="seg-pill" aria-hidden="true" style="transform: translateX({{pillX}})"></div>
        <button type="button" class="{{segAll}}" aria-pressed="{{isAll}}" onClick="{{showAll}}">Todas</button>
        <button type="button" class="{{segUnread}}" aria-pressed="{{isUnreadView}}" onClick="{{showUnread}}">Não lidas<span class="mono" style="font-size: 12px; color: #5C6385">{{unread}}</span></button>
      </div>

      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
        <div class="card fade" style="padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4040D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          <p style="margin: 0; font-size: 16px; font-weight: 600">Nenhuma notificação não lida.</p>
          <button type="button" class="btn btn-q" onClick="{{showAll}}">Ver todas</button>
        </div>
      </sc-if>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section class="fade" aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 6px">
          <h2 class="mono" style="margin: 0 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #5C6385">{{g.title}}</h2>
          <div class="card" style="padding: 6px">
            <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
              <article class="{{n.cls}}">
                <span aria-hidden="true" style="width: 38px; height: 38px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{n.iconStyle}}">
                  <sc-if value="{{n.isActivity}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></sc-if>
                  <sc-if value="{{n.isCalendar}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></sc-if>
                  <sc-if value="{{n.isPerson}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg></sc-if>
                  <sc-if value="{{n.isPayment}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg></sc-if>
                </span>
                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
                  <a href="{{n.href}}" class="go" style="font-size: 15px; line-height: 1.45"><span style="font-weight: 600">{{n.who}}</span> {{n.text}}</a>
                  <span style="font-size: 13px; color: #5C6385">{{n.kind}} · {{n.when}}</span>
                </div>
                <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}">
                  <button type="button" class="mark" aria-label="{{n.markLabel}}" onClick="{{n.markRead}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
                </sc-if>
                <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}">
                  <span aria-hidden="true" style="width: 8px; height: 8px; margin-top: 8px; flex: none; border-radius: 50%; background: #4040D6"></span>
                </sc-if>
              </article>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'all', read: ['n6', 'n7', 'n8', 'n9'], leaving: [] };
  }
  componentWillUnmount() {
    clearTimeout(this.tl);
  }
  renderVals() {
    const s = this.state;
    const kinds = {
      activity: ['Resposta enviada', 'Revisar.dc.html', 'background: #E6EAFD; color: #2B2E9E'],
      confirm: ['Presença confirmada', 'Agenda.dc.html', 'background: #E6EAFD; color: #2B2E9E'],
      cancel: ['Cancelamento', 'Agenda.dc.html', 'background: #FDEBE7; color: #9E3522'],
      invite: ['Convite aceito', 'Ficha.dc.html', 'background: #EFF2FB; color: #3E4466'],
      payment: ['Pagamento', 'Assinatura.dc.html', 'background: #FDEBE7; color: #9E3522']
    };
    const all = [
      { id: 'n1', group: 'Hoje', kind: 'activity', who: 'Júlia Andrade', text: 'enviou a resposta de Higiene do sono.', when: '10h04' },
      { id: 'n2', group: 'Hoje', kind: 'confirm', who: 'Júlia Andrade', text: 'confirmou a sessão de hoje às 14h.', when: '9h12' },
      { id: 'n3', group: 'Hoje', kind: 'cancel', who: 'Sofia Lima', text: 'cancelou a sessão de sexta, 18h.', when: '8h40' },
      { id: 'n4', group: 'Ontem', kind: 'activity', who: 'Pedro Tavares', text: 'enviou a resposta de Registro de pensamentos.', when: '21h12' },
      { id: 'n5', group: 'Ontem', kind: 'payment', who: 'Assinatura', text: 'O pagamento de outubro foi recusado pelo banco. Atualize o cartão até 15 out.', when: '7h00' },
      { id: 'n6', group: 'Ontem', kind: 'confirm', who: 'Bruno Felix', text: 'confirmou a sessão de hoje às 16h.', when: '18h30' },
      { id: 'n7', group: 'Esta semana', kind: 'invite', who: 'Mateus Reis', text: 'aceitou o convite e criou a conta.', when: 'segunda, 15h20' },
      { id: 'n8', group: 'Esta semana', kind: 'activity', who: 'Carolina Mota', text: 'enviou a resposta de Diário de gratidão.', when: 'segunda, 9h02' },
      { id: 'n9', group: 'Esta semana', kind: 'confirm', who: 'Henrique Brito', text: 'confirmou a sessão de terça às 10h.', when: 'domingo, 20h45' }
    ];
    const isRead = (id) => s.read.indexOf(id) >= 0;
    const unread = all.filter((n) => !isRead(n.id)).length;
    const visible = all.filter((n) => s.view === 'all' || !isRead(n.id) || s.leaving.indexOf(n.id) >= 0);
    const markRead = (id) => {
      if (s.view === 'unread') {
        this.setState({ leaving: s.leaving.concat([id]), read: s.read.concat([id]) });
        clearTimeout(this.tl);
        this.tl = setTimeout(() => this.setState({ leaving: [] }), 380);
      } else {
        this.setState({ read: s.read.concat([id]) });
      }
    };
    const groups = ['Hoje', 'Ontem', 'Esta semana'].map((title) => ({
      title: title,
      items: visible.filter((n) => n.group === title).map((n) => {
        const r = isRead(n.id);
        const leaving = s.leaving.indexOf(n.id) >= 0;
        const k = kinds[n.kind];
        return {
          who: n.who, text: n.text, when: n.when,
          kind: k[0], href: k[1], iconStyle: k[2],
          isActivity: n.kind === 'activity',
          isCalendar: n.kind === 'confirm' || n.kind === 'cancel',
          isPerson: n.kind === 'invite',
          isPayment: n.kind === 'payment',
          unread: !r,
          cls: leaving ? 'note leaving' : (r ? 'note read' : 'note unread'),
          markLabel: 'Marcar como lida: ' + n.who,
          markRead: () => markRead(n.id)
        };
      })
    })).filter((g) => g.items.length > 0);
    return {
      unread: unread,
      hasUnread: unread > 0,
      noUnread: unread === 0,
      bellLabel: unread === 1 ? '1 notificação não lida' : unread + ' notificações não lidas',
      summary: unread === 0 ? 'Tudo lido.' : (unread === 1 ? '1 não lida.' : unread + ' não lidas.'),
      markAll: () => this.setState({ read: all.map((n) => n.id) }),
      isAll: s.view === 'all',
      isUnreadView: s.view === 'unread',
      pillX: s.view === 'all' ? '0px' : '120px',
      segAll: s.view === 'all' ? 'seg on' : 'seg',
      segUnread: s.view === 'unread' ? 'seg on' : 'seg',
      showAll: () => this.setState({ view: 'all' }),
      showUnread: () => this.setState({ view: 'unread' }),
      isEmpty: groups.length === 0,
      groups: groups
    };
  }
}
</script>
</body>
</html>
